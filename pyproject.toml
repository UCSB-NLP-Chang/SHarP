[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sharp-harness"
version = "0.1.0"
description = "Saliency-guided pruning of agent harness modules"
requires-python = ">=3.12,<3.14"
dependencies = ["scipy>=1.10,<2"]

[project.scripts]
sharp-screen = "sharp.screen:main"

[tool.setuptools.packages.find]
where = ["src"]
